name: Build Desktop App & Upload to Supabase

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản phát hành (ví dụ: 1.0.0)'
        required: false
        default: '1.0.0'
      skip_tests:
        description: 'Bỏ qua bước kiểm thử hệ thống (test_system.py)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-upload:
    name: 🏗️ Build Windows Installer & Upload
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Thiết lập Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: ⚙️ Cài đặt Inno Setup 6 Compiler
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 📦 Cài đặt thư viện phụ thuộc (Dependencies)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: 🧪 Chạy Kiểm thử Hệ thống (System Tests)
        if: ${{ !inputs.skip_tests }}
        run: |
          python test_system.py

      - name: 🔨 Biên dịch PyInstaller & Đóng gói Inno Setup
        run: |
          python build_installer.py

      - name: 🔍 Kiểm tra File đầu ra (Verify Installer Output)
        shell: pwsh
        run: |
          if (Test-Path "installer_output/Vortex_Downloader_Setup.exe") {
            $item = Get-Item "installer_output/Vortex_Downloader_Setup.exe"
            $mb = [math]::Round($item.Length / 1MB, 2)
            Write-Host " [✓] File cài đặt đã tạo thành công: $($item.FullName)"
            Write-Host " [✓] Dung lượng: $mb MB"
          } else {
            Write-Error " [!] Lỗi: Không tìm thấy file installer_output/Vortex_Downloader_Setup.exe!"
            exit 1
          }

      - name: 📤 Lưu trữ Bản cài đặt lên GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vortex_Downloader_Windows_Setup
          path: installer_output/Vortex_Downloader_Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: 🚀 Tải File Cài đặt lên Supabase Storage (Tùy chọn)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET || 'releases' }}
          VERSION: ${{ inputs.version || github.ref_name }}
          SKIP_ON_MISSING_CREDS: "true"
        run: |
          python scripts/upload_to_supabase.py --file installer_output/Vortex_Downloader_Setup.exe --skip-on-missing-creds

      - name: 🏷️ Tạo hoặc Cập nhật Bản phát hành GitHub Release (Hỗ trợ file đến 2GB)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Vortex Downloader {0}', github.ref_name) || 'Vortex Downloader (Latest Release)' }}
          body: |
            ## ⚡ Vortex Downloader - Windows Release
            
            - **Tên file:** `Vortex_Downloader_Setup.exe`
            - **Nền tảng:** Windows 10/11 (64-bit)
            - **Bản phát hành:** ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
            
            ### 📥 Hướng dẫn cài đặt
            1. Bấm tải file `Vortex_Downloader_Setup.exe` bên dưới.
            2. Click đúp chuột vào file để khởi chạy bộ cài đặt và sử dụng ngay.
          files: installer_output/Vortex_Downloader_Setup.exe
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true

      - name: 📝 Tạo Bảng Tóm tắt & Link Tải Trực Tiếp (Step Summary)
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "latest" }
          $downloadUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/Vortex_Downloader_Setup.exe"
          $releaseUrl = "https://github.com/${{ github.repository }}/releases/tag/$tag"
          $sizeMb = [math]::Round((Get-Item "installer_output/Vortex_Downloader_Setup.exe").Length / 1MB, 2)
          
          @"
          ## 🚀 Vortex Downloader - Bản Phát Hành Đã Sẵn Sàng!
          
          | Thông tin | Chi tiết |
          | :--- | :--- |
          | **File cài đặt** | `Vortex_Downloader_Setup.exe` |
          | **Dung lượng** | **$sizeMb MB** |
          | **Nền tảng** | Windows 10/11 (64-bit) |
          | **Trang Release** | [Xem GitHub Release]($releaseUrl) |
          | **Link tải trực tiếp** | [📥 **Tải Vortex Downloader ($sizeMb MB)**]($downloadUrl) |
          
          > ✨ *File cài đặt đã được đóng gói thành công và lưu trữ trên CDN GitHub Releases (hỗ trợ tối đa 2GB).*
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
