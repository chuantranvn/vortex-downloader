name: Build Desktop App & Upload to Supabase

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản phát hành (ví dụ: 1.0.0)'
        required: false
        default: '1.0.0'
      skip_tests:
        description: 'Bỏ qua bước kiểm thử hệ thống (test_system.py)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-upload:
    name: 🏗️ Build Windows Installer & Upload
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: 📥 Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Thiết lập Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: ⚙️ Cài đặt Inno Setup 6 Compiler
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          echo "C:\Program Files (x86)\Inno Setup 6" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: 📦 Cài đặt thư viện phụ thuộc (Dependencies)
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: 🧪 Chạy Kiểm thử Hệ thống (System Tests)
        if: ${{ !inputs.skip_tests }}
        run: |
          python test_system.py

      - name: 🔨 Biên dịch PyInstaller & Đóng gói Inno Setup
        run: |
          python build_installer.py

      - name: 🔍 Kiểm tra File đầu ra (Verify Output Files)
        shell: pwsh
        run: |
          $exePath = "installer_output/Vortex_Downloader_Setup.exe"
          $zipPath = "installer_output/Vortex_Extension_Chrome_Edge.zip"
          if (Test-Path $exePath) {
            $mb = [math]::Round((Get-Item $exePath).Length / 1MB, 2)
            Write-Host " [✓] File cài đặt: $exePath ($mb MB)"
          } else {
            Write-Error " [!] Lỗi: Không tìm thấy $exePath!"
            exit 1
          }
          if (Test-Path $zipPath) {
            $kb = [math]::Round((Get-Item $zipPath).Length / 1KB, 2)
            Write-Host " [✓] File Extension Zip: $zipPath ($kb KB)"
          } else {
            Write-Warning " [!] Cảnh báo: Không tìm thấy $zipPath"
          }

      - name: 📤 Lưu trữ Bản cài đặt & Extension lên GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Vortex_Downloader_Windows_Release
          path: |
            installer_output/Vortex_Downloader_Setup.exe
            installer_output/Vortex_Extension_Chrome_Edge.zip
          if-no-files-found: warn
          retention-days: 14

      - name: 🚀 Tải File Cài đặt lên Supabase Storage (Tùy chọn)
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          SUPABASE_BUCKET: ${{ secrets.SUPABASE_BUCKET || 'releases' }}
          VERSION: ${{ inputs.version || github.ref_name }}
          SKIP_ON_MISSING_CREDS: "true"
        run: |
          python scripts/upload_to_supabase.py --file installer_output/Vortex_Downloader_Setup.exe --skip-on-missing-creds

      - name: 🏷️ Tạo hoặc Cập nhật Bản phát hành GitHub Release (Hỗ trợ file đến 2GB)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('Vortex Downloader {0}', github.ref_name) || 'Vortex Downloader (Latest Release)' }}
          body: |
            ## ⚡ Vortex Downloader - Windows Release & Browser Extension
            
            - **Bản phát hành:** ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'Latest Build' }}
            - **Hệ điều hành:** Windows 10/11 (64-bit)
            
            ### 📦 Danh sách file phát hành:
            1. **`Vortex_Downloader_Setup.exe`**: Bộ cài đặt phần mềm Desktop chính (tự động tích hợp sẵn Extension vào ổ cứng và tạo phím tắt trong Start Menu).
            2. **`Vortex_Extension_Chrome_Edge.zip`**: File nén tiện ích mở rộng dành cho Google Chrome, Microsoft Edge, Cốc Cốc.
            
            ### 🧩 Hướng dẫn cài đặt Tiện ích mở rộng (Extension):
            1. Tải và giải nén file `Vortex_Extension_Chrome_Edge.zip`.
            2. Mở trình duyệt Chrome/Edge, vào `chrome://extensions` hoặc `edge://extensions`.
            3. Bật **Chế độ dành cho nhà phát triển (Developer mode)** ở góc trên bên phải.
            4. Nhấn **Tải tiện ích đã giải nén (Load unpacked)** và chọn thư mục vừa giải nén.
          files: |
            installer_output/Vortex_Downloader_Setup.exe
            installer_output/Vortex_Extension_Chrome_Edge.zip
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          generate_release_notes: true

      - name: 📝 Tạo Bảng Tóm tắt & Link Tải Trực Tiếp (Step Summary)
        shell: pwsh
        run: |
          $tag = if ("${{ github.ref }}".StartsWith("refs/tags/")) { "${{ github.ref_name }}" } else { "latest" }
          $repo = "${{ github.repository }}"
          $exeUrl = "https://github.com/$repo/releases/download/$tag/Vortex_Downloader_Setup.exe"
          $extUrl = "https://github.com/$repo/releases/download/$tag/Vortex_Extension_Chrome_Edge.zip"
          $releaseUrl = "https://github.com/$repo/releases/tag/$tag"
          $sizeMb = [math]::Round((Get-Item "installer_output/Vortex_Downloader_Setup.exe").Length / 1MB, 2)
          
          @"
          ## 🚀 Vortex Downloader - Bản Phát Hành Đã Sẵn Sàng!
          
          | Thành phần | File tải về | Dung lượng | Đường dẫn tải trực tiếp |
          | :--- | :--- | :--- | :--- |
          | **Phần mềm Desktop** | `Vortex_Downloader_Setup.exe` | **$sizeMb MB** | [📥 **Tải Bộ Cài Đặt (.exe)**]($exeUrl) |
          | **Tiện ích Trình duyệt** | `Vortex_Extension_Chrome_Edge.zip` | Nhẹ (~45 KB) | [🧩 **Tải Tiện Ích (.zip)**]($extUrl) |
          
          ### 🔗 Xem chi tiết:
          👉 **[Trang GitHub Release]($releaseUrl)**
          
          > ✨ *Cả bộ cài đặt Desktop và Tiện ích mở rộng đều đã được xuất bản tự động qua GitHub Releases.*
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
