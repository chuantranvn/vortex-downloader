<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Vortex Downloader</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <img src="../icons/icon32.png" alt="Logo" class="logo">
        <div class="title-wrap">
            <span class="brand-title">VORTEX DOWNLOADER</span>
            <span id="gateway-status" class="status-badge connecting">● Đang kiểm tra...</span>
        </div>
    </div>

    <div class="content">
        <div class="page-info">
            <div class="info-label">Trang hiện tại:</div>
            <div id="tab-title" class="tab-title">Đang tải...</div>
        </div>

        <div class="actions">
            <button id="btn-quick-download" class="btn btn-primary">
                <span>🚀</span> Tải Video Trên Trang Này
            </button>
            <button id="btn-audio-download" class="btn btn-secondary">
                <span>🎵</span> Chỉ Tải Âm Thanh (MP3)
            </button>
            <button id="btn-restore-bar" class="btn btn-outline" title="Hiện lại thanh tải nổi nếu bạn đã đóng hoặc thu nhỏ">
                <span>🔄</span> Hiện Lại Thanh Tải Trên Trang
            </button>
        </div>

        <div class="folder-config">
            <div class="info-label">📁 Thư mục lưu video:</div>
            <div class="folder-row">
                <input type="text" id="save-folder" class="folder-input" placeholder="Mặc định: downloads/" />
                <button id="btn-browse-folder" class="btn-small" type="button" title="Mở hộp thoại chọn thư mục trên máy tính">📂 Chọn</button>
                <button id="btn-save-folder" class="btn-small" type="button" title="Lưu thư mục vừa nhập">💾 Lưu</button>
            </div>
        </div>

        <div id="status-message" class="status-message"></div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
